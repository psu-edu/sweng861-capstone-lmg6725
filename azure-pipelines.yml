trigger:
  branches:
    include:
      - main
      - feature/week6-devops

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  # -------------------------
  # Backend
  # -------------------------

  - task: UsePythonVersion@0
    displayName: "Set up Python 3.12"
    inputs:
      versionSpec: "3.12"

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    workingDirectory: backend
    displayName: "Install backend dependencies"

  - script: python -m pytest
    workingDirectory: backend
    displayName: "Run backend tests"

  # -------------------------
  # Frontend
  # -------------------------

  - task: NodeTool@0
    displayName: "Set up Node.js 22"
    inputs:
      versionSpec: "22.x"

  - script: npm ci
    workingDirectory: frontend
    displayName: "Install frontend dependencies"

  - script: npx vitest run
    workingDirectory: frontend
    displayName: "Run frontend tests"

  - script: npm run build
    workingDirectory: frontend
    displayName: "Build frontend"
    env:
      VITE_BACKEND_URL: http://localhost:5000

  # -------------------------
  # Security quality gate
  # -------------------------

  - script: npm audit --audit-level=high
    workingDirectory: frontend
    displayName: "Audit frontend dependencies"

  # -------------------------
  # Docker package stage
  # -------------------------

  - script: docker build -t sweng861-backend:$(Build.BuildId) .
    workingDirectory: backend
    displayName: "Build backend Docker image"

  - script: docker build -t sweng861-frontend:$(Build.BuildId) .
    workingDirectory: frontend
    displayName: "Build frontend Docker image"